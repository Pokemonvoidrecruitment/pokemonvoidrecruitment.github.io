services:
  - type: web
    name: pokemonvoid-recruitment
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://pokemonvoidrecruitment.github.io
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DIRECTOR_ROLE_ID
        sync: false
      - key: DIRECTOR_CHANNEL_ID
        sync: false
      - key: INTERNAL_EVENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
